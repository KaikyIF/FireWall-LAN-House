
services:
  cliente:
    build: ./cliente
    container_name: lanhouse-cliente
    cap_add:
      - NET_ADMIN
    networks:
      cliente_net:
        ipv4_address: 10.80.1.10
    depends_on:
      - firewall
    tty: true

  firewall:
    build: ./firewall
    container_name: lanhouse-firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      cliente_net:
        ipv4_address: 10.80.1.2
      web_net:
        ipv4_address: 10.80.2.2
      db_net:
        ipv4_address: 10.80.3.2

  web:
    build: ./web
    container_name: lanhouse-web
    cap_add:
      - NET_ADMIN
    networks:
      web_net:
        ipv4_address: 10.80.2.10
    depends_on:
      - firewall
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro

  db:
    image: postgres:16-alpine
    container_name: lanhouse-db
    environment:
      POSTGRES_USER: lanhouse
      POSTGRES_PASSWORD: lanhouse123
      POSTGRES_DB: lanhouse
    networks:
      db_net:
        ipv4_address: 10.80.3.20

networks:
  cliente_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.80.1.0/24

  web_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.80.2.0/24

  db_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.80.3.0/24
