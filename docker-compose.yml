services:

  cliente:
    build: ./cliente
    container_name: lanhouse-cliente
    networks:
      cliente_net:
        ipv4_address: 172.20.0.10
    depends_on:
      - firewall
    tty: true

  firewall:
    build: ./firewall
    container_name: lanhouse-firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      cliente_net:
        ipv4_address: 172.20.0.2
      dmz:
        ipv4_address: 172.21.0.2

  web:
    image: nginx:alpine
    container_name: lanhouse-web
    networks:
      dmz:
        ipv4_address: 172.21.0.10
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro

  db:
    image: postgres:16-alpine
    container_name: lanhouse-db
    environment:
      POSTGRES_USER: lanhouse
      POSTGRES_PASSWORD: lanhouse123
      POSTGRES_DB: lanhouse
    networks:
      dmz:
        ipv4_address: 172.21.0.20

networks:

  cliente_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24